  <rect width="48" height="48" rx="14" fill="#f5ead8"/>
  <rect x="7" y="20.5" width="34" height="7" rx="3.5" fill="#ccd5b7"/>
  <rect x="14" y="20.5" width="20" height="7" rx="3.5" fill="#7a8a5e"/>
  <circle cx="31" cy="24" r="7.5" fill="#f5ead8"/>
  <circle cx="31" cy="24" r="5.5" fill="#c67139"/>
</svg>
